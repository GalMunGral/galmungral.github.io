<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writings &ndash; Wenqi He</title>
    <link rel="stylesheet" href="/style.css" />
</head>
  <body class="writing-index">
    <p class="disclaimer-banner"><em>The arguments below are original; Claude (Anthropic) assisted with some of the English prose and produced the Chinese translations, which have not been checked line by line.<br /><span lang="zh">以下論證均為原創；Claude（Anthropic）協助撰寫了部分英文文字，並完成了中文翻譯，譯文尚未逐句核對。</span></em></p>

    <div class="essay-reader">
      <nav class="essay-menu">
        <p class="essay-menu-home"><a href="/">&larr; Wenqi He</a></p>
        <ul>
          <li><button type="button" class="active" data-index="0"><em>Preface</em><br /><span lang="zh">序</span></button></li>
          <li><button type="button" data-index="1"><em>The Computationalist Manifesto</em><br /><span lang="zh">計算主義宣言</span></button></li>
          <li><button type="button" data-index="2"><em>Research Software as Rhetoric</em><br /><span lang="zh">作為修辭的研究型軟件</span></button></li>
          <li><button type="button" data-index="3"><em>RE: Research Software as Rhetoric</em><br /><span lang="zh">回覆：作為修辭的研究型軟件</span></button></li>
          <li><button type="button" data-index="4"><em>Some Thoughts on AI Coding</em><br /><span lang="zh">關於 AI 編程的一些思考</span></button></li>
          <li><button type="button" data-index="5"><em>On Software Engineering as a Career</em><br /><span lang="zh">論軟件工程作為職業</span></button></li>
          <li><button type="button" data-index="6"><em>The Great Pathology</em><br /><span lang="zh">頑疾</span></button></li>
          <li><button type="button" data-index="7"><em>On Legacy</em><br /><span lang="zh">論遺留代碼</span></button></li>
          <li><button type="button" data-index="8"><em>Beneath the Interface</em><br /><span lang="zh">界面之下</span></button></li>
          <li><button type="button" data-index="9"><em>A Survey of 2D Graphics</em><br /><span lang="zh">二維圖形概覽</span></button></li>
          <li><button type="button" data-index="10"><em>Foundations</em><br /><span lang="zh">根基</span></button></li>
        </ul>
      </nav>

      <div class="essay-viewer">
        <div class="essay-card essay-card-preface" data-index="0"><iframe src="preface.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="1"><iframe src="manifesto.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="2"><iframe src="critique.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="3"><iframe src="two-letters.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="4"><iframe src="ai-coding.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="5"><iframe src="stamp-collecting.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="6"><iframe src="the-great-pathology.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="7"><iframe src="on-legacy.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="8"><iframe src="/gui-first-principles/" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="9"><iframe src="vector-graphics.html" loading="lazy"></iframe></div>
        <div class="essay-card" data-index="10"><iframe src="anima-mechanismi.html" loading="lazy"></iframe></div>
      </div>
    </div>

    <script type="module">
      const menu = document.querySelector(".essay-menu");
      const viewer = document.querySelector(".essay-viewer");
      const cards = [...viewer.querySelectorAll(".essay-card")];
      const buttons = [...menu.querySelectorAll("button[data-index]")];

      const setActive = (index) => {
        for (const b of buttons) b.classList.toggle("active", b.dataset.index === index);
      };

      menu.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-index]");
        if (!btn) return;

        setActive(btn.dataset.index);
        viewer
          .querySelector(`.essay-card[data-index="${btn.dataset.index}"]`)
          ?.scrollIntoView({ behavior: "smooth", inline: "center" });
      });

      // Keep the active menu item in sync with whichever essay is in view,
      // as the reader scrolls horizontally through the essays.
      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) setActive(entry.target.dataset.index);
          }
        },
        { root: viewer, threshold: 0.6 }
      );
      for (const card of cards) observer.observe(card);
    </script>
  </body>
</html>
